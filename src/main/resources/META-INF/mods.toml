modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = ""

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "女仆建筑"
credits = "Inspired by Create's Schematic"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# 车万女仆：可选软依赖，未安装时女仆相关功能自动禁用
[[dependencies.${mod_id}]]
    modId = "touhou_little_maid"
    mandatory = false
    versionRange = "[1.3.0,)"
    ordering = "AFTER"
    side = "BOTH"
