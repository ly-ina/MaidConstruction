name: Build and Release

on:
  # 推 v* 标签时构建并发布 Release
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发，只构建不发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Environment info
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --version

      # Forge 要下不少依赖，第一次跑会比较慢。
      # 失败时把末尾日志写进 job summary，免得因为是私有日志而两眼一抹黑。
      - name: Build
        run: |
          set +e
          ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Build failed (exit $status)"
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # 构建挂了的时候，把 gradle 报告一并传上去，省得只能干瞪眼
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/tmp/
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaidConstruction
          path: build/libs/*.jar
          if-no-files-found: error

      # 更新说明从 CHANGELOG.md 里抽当前版本那一段。
      # 手写的说明比 GitHub 自动拼出来的 commit 列表可读得多，
      # 而且能按"新增 / 改进 / 修复"分类。
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 用 index() 做前缀匹配，而不是正则：
          # 版本号里的点按正则会变成"任意字符"，"[", "]" 还得层层转义，容易出错。
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md 里没有 $version 的条目，详见仓库中的 CHANGELOG。" > release_notes.md
          fi
          cat release_notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: release_notes.md
          draft: false

      # 顺手发一份到 CurseForge：以后打标签就是"GitHub Release + CurseForge"双发，同版本同 jar。
      # 需要仓库 Secrets：CF_API_KEY（CF 头像 → API Tokens 新建）与 CF_PROJECT_ID（项目 Settings 里的数字 ID）。
      # 发布说明直接复用上面抽好的 release_notes.md，两边正文不会各说各的。
      - name: Resolve jar and version
        id: jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FILE=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/v')
        # 失败不拦整个发布：GH Release 已经出来了，CF 那边手动补传一次即可；
        # 但日志里会留下这一段的红叉，别当没发生
        continue-on-error: true
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_KEY }}
          project_id: ${{ secrets.CF_PROJECT_ID }}
          game_endpoint: minecraft
          release_type: release
          display_name: "${{ steps.jar.outputs.version }} (Forge 1.20.1)"
          changelog: release_notes.md
          changelog_type: markdown
          # CF 的 gameVersions 是同一个数组：游戏版本与加载器一起给（少给加载器会被拒）
          game_versions: "1.20.1,Forge"
          file_path: ${{ steps.jar.outputs.path }}
