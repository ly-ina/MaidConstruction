name: Build and Release

on:
  # 推 v* 标签时构建并发布 Release
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发，只构建不发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Environment info
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --version

      # Forge 要下不少依赖，第一次跑会比较慢。
      # 失败时把末尾日志写进 job summary，免得因为是私有日志而两眼一抹黑。
      - name: Build
        run: |
          set +e
          ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Build failed (exit $status)"
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # 构建挂了的时候，把 gradle 报告一并传上去，省得只能干瞪眼
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/tmp/
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaidConstruction
          path: build/libs/*.jar
          if-no-files-found: error

      # 更新说明从 CHANGELOG.md 里抽当前版本那一段。
      # 手写的说明比 GitHub 自动拼出来的 commit 列表可读得多，
      # 而且能按"新增 / 改进 / 修复"分类。
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 用 index() 做前缀匹配，而不是正则：
          # 版本号里的点按正则会变成"任意字符"，"[", "]" 还得层层转义，容易出错。
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md 里没有 $version 的条目，详见仓库中的 CHANGELOG。" > release_notes.md
          fi
          cat release_notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: release_notes.md
          draft: false

      # 顺手发一份到 CurseForge：以后打标签就是"GitHub Release + CurseForge"双发，同版本同 jar。
      # 需要仓库 Secrets：CF_API_KEY（CF 头像 → API Tokens 新建）与 CF_PROJECT_ID（项目 Settings 里的数字 ID）。
      # 发布说明直接复用上面抽好的 release_notes.md，两边正文不会各说各的。
      - name: Resolve jar and version
        id: jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FILE=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 直连 CurseForge 官方上传 API（不再用第三方 action）。
      # 为什么换掉：那个 action 的 game_versions 会把 "Forge" 解析成数字 ID（9993），
      # CF 直接回 400 "Invalid game version ID"，而它又带着 continue-on-error，
      # 于是日志里是绿的、CF 上根本没有文件——查了一整轮才发现。
      # 官方 API 的 gameVersions 收的是**名字**（"1.20.1" / "Forge"），与项目页那两个下拉一致。
      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CF_TOKEN: ${{ secrets.CF_API_KEY }}
          CF_PROJECT: ${{ secrets.CF_PROJECT_ID }}
          VERSION: ${{ steps.jar.outputs.version }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          set -euo pipefail
          # 用 jq 拼 metadata：changelog 里有引号、换行、中文，手工拼 JSON 必炸
          jq -n \
            --arg changelog "$(cat release_notes.md)" \
            --arg name "${VERSION} (Forge 1.20.1)" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name,
              releaseType: "release", gameVersions: ["1.20.1", "Forge"]}' > cf_meta.json
          echo "== uploading $(basename "${JAR}") =="
          curl --fail-with-body -sS -X POST \
            "https://minecraft.curseforge.com/api/projects/${CF_PROJECT}/uploadFile" \
            -H "X-Api-Token: ${CF_TOKEN}" \
            -F "metadata=@cf_meta.json;type=application/json" \
            -F "file=@${JAR}"
