name: Build and Release

on:
  # 推 v* 标签时构建并发布 Release
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发，只构建不发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Environment info
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --version

      # Forge 要下不少依赖，第一次跑会比较慢。
      # 失败时把末尾日志写进 job summary，免得因为是私有日志而两眼一抹黑。
      - name: Build
        run: |
          set +e
          ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Build failed (exit $status)"
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # 构建挂了的时候，把 gradle 报告一并传上去，省得只能干瞪眼
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/tmp/
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaidConstruction
          path: build/libs/*.jar
          if-no-files-found: error

      # 更新说明从 CHANGELOG.md 里抽当前版本那一段。
      # 手写的说明比 GitHub 自动拼出来的 commit 列表可读得多，
      # 而且能按"新增 / 改进 / 修复"分类。
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 用 index() 做前缀匹配，而不是正则：
          # 版本号里的点按正则会变成"任意字符"，"[", "]" 还得层层转义，容易出错。
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md 里没有 $version 的条目，详见仓库中的 CHANGELOG。" > release_notes.md
          fi
          cat release_notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: release_notes.md
          draft: false
