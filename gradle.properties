# ForgeGradle 首次要反编译 Minecraft，内存给足一点，CI 上尤其明显
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false

# 编译用的 JDK 版本，Forge 1.20.1 推荐 17
java_version=17

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20,1.21)
forge_version=47.1.3
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# 车万女仆版本（1.20.1 Forge）
tlm_version=1.5.2-forge+mc1.20.1

# AE2 版本（1.20.1 Forge）。仅用于编译期，不做运行时依赖
ae2_version=15.4.10

# Mod 信息
# 别用 blueprint：那是 Team Abnormals 的库模组（1.20.1 的 7.x）的 id，撞了只能加载一个。
# 命名空间（assets/<id>、data/<id>、物品 id 前缀）全部跟着这个值，见 DEVELOPER §7.21
mod_id=maidconstruction
# 女仆建筑的英文名，用于 jar 产物名（会去掉空格，产出 MaidConstruction-<version>.jar）
# 游戏内显示名见 mods.toml 的 displayName
mod_name=Maid Construction
mod_license=MIT
# 2.0.0：模组 id 改名（blueprint -> maidconstruction）是破坏性更新——旧世界里的物品与方块会变成
# "未知物品"，图纸目录、后缀、配置文件名也跟着换。按语义化版本，破坏性改动走主版本，见 CHANGELOG [2.0.0]
mod_version=2.0.0
mod_group_id=com.example.blueprint
# 署名。汉字必须写成 unicode 转义：java.util.Properties 按 ISO-8859-1 解析本文件，
# 直接写 UTF-8 汉字会变成乱码。\u4F0A\u7EB3 = 伊纳
mod_authors=\u4F0A\u7EB3 (lyina)
mod_description=A Create-style blueprint: capture structures, project them anywhere, and let maids build them. Integrates with Touhou Little Maid and AE2.
