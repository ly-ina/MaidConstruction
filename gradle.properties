# ForgeGradle 首次要反编译 Minecraft，内存给足一点，CI 上尤其明显
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false

# 编译用的 JDK 版本，Forge 1.20.1 推荐 17
java_version=17

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20,1.21)
forge_version=47.1.3
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# 车万女仆版本（1.20.1 Forge）
tlm_version=1.5.2-forge+mc1.20.1

# AE2 版本（1.20.1 Forge）。仅用于编译期，不做运行时依赖
ae2_version=15.4.10

# Mod 信息
mod_id=blueprint
# 女仆建筑的英文名，用于 jar 产物名（会去掉空格，产出 MaidConstruction-<version>.jar）
# 游戏内显示名见 mods.toml 的 displayName
mod_name=Maid Construction
mod_license=MIT
mod_version=1.2.0
mod_group_id=com.example.blueprint
mod_authors=YourName
mod_description=A Create-style blueprint: capture structures, project them anywhere, and let maids build them. Integrates with Touhou Little Maid and AE2.
