plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = mod_version
group = mod_group_id

// 直接用英文 mod 名做产物名（去掉空格，避免文件名里出现空格）
archivesBaseName = mod_name.replace(' ', '')

// Forge 1.20.1 官方要求 JDK 17；如果本机只有更高版本的 JDK，
// 可以在 gradle.properties 里把 java_version 改掉（或运行时加 -Pjava_version=21）
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// 本地核对用的原始 jar 目录：项目下的 ae2check/、或它外面那层 MyMod/ae2check/ 都认
def localModDirs = [file('ae2check'), file('../ae2check')].findAll { it.isDirectory() }

repositories {
    mavenCentral()

    // 本地 jar 必须走 flatDir：{@code fg.deobf} **不认 files(...) 依赖**——
    // 它只会甩一句 "files(...) dependencies are not deobfuscated"，然后拿 SRG 名去编译，
    // 结果满屏 cannot find symbol。flatDir 才是它能反映射的形状。
    localModDirs.each { dir -> flatDir { dirs dir } }

    // 车万女仆通过 Modrinth Maven 分发（TLM 官方推荐的依赖方式）
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // 兜底：CurseForge Maven
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

// 把 gradle.properties 里的值填进 mods.toml / pack.mcmeta。
// 少了这一步，jar 里的 modId 会保持成字面量 "${mod_id}"，Forge 直接拒绝加载。
processResources {
    // Windows 平台默认编码是 GBK，不显式指定的话中文会被写成乱码
    filteringCharset = 'UTF-8'

    def replaceProperties = [
            version                 : version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range
    ]
    inputs.properties(replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// 本地核对用的原始 jar：有就直接拿它编译，没有才走 Modrinth 下载。
// 为什么要这两个 jar：compileOnly 也要求在编译期 classpath 上解析得到那些类——
// integration.maid 里直接写了 EntityMaid、integration.ae2 里直接写了 appeng.*；
// 而 fg.deobf 还得先拿到原始 jar 做一次 SRG → 官方名的反向映射。
// 这里按文件名通配找、再从文件名反推 flatDir 要的 "name:version"（flatDir 不看 group，
// 只认 <name>-<version>.jar），所以换 jar 版本时不必改脚本。
def localModNotation = { String pattern ->
    for (def dir : localModDirs) {
        def found = fileTree(dir) { include pattern }.files.find { true }
        if (found != null) {
            def base = found.name.substring(0, found.name.length() - '.jar'.length())
            int dash = base.indexOf('-')
            if (dash > 0) {
                return "local:" + base.substring(0, dash) + ":" + base.substring(dash + 1)
            }
        }
    }
    return null
}
def localTlm = localModNotation('*ouhou*maid*.jar')
def localAe2 = localModNotation('*appliedenergistics2*.jar')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 车万女仆（软依赖：运行时未安装也不会崩溃，靠 @LittleMaidExtension 反射加载）
    if (localTlm != null) {
        compileOnly fg.deobf(localTlm)
        runtimeOnly fg.deobf(localTlm)
    } else {
        compileOnly fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")
        runtimeOnly fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")
    }

    // AE2 也是软依赖，但故意只进编译期、不加 runtimeOnly：
    // 整合包装了 AE2 就能从 ME 网络取料，没装则一切照旧。
    // 相关代码全部关在 integration.ae2 包里，运行时由 Ae2Compat 把关，
    // 避免没装 AE2 时触发 NoClassDefFoundError。
    if (localAe2 != null) {
        compileOnly fg.deobf(localAe2)
    } else {
        compileOnly fg.deobf("maven.modrinth:ae2:${ae2_version}")
    }

    // 单元测试：只测**不碰 Minecraft 运行时**的那部分纯逻辑。
    // 这一轮反复改错的几处（客户端进度记账、站位判据、进度只往前不往回）恰好都是纯逻辑，
    // 喂假数据就能测——有测试就不必每次都进游戏里试出来。
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

jar {
    // MIT 要求协议与版权声明随「所有副本」分发，而 mods.toml 里的 license 只是一个协议名，
    // 所以把根目录的 LICENSE 一并打进 jar（reobfJar 只重映射 .class，这个条目会原样留下）
    from('LICENSE') {
        into 'META-INF'
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}
